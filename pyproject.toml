[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pv-outage-classifier"
version = "0.1.0"
description = "Detect, classify and cost outages and faults of PV plants at plant, inverter and string level, with availability KPIs: a comparison of threshold, expected-model, peer, Hampel, CUSUM, isolation forest and gradient boosting methods on a simulated plant with known truth and on real NREL PVDAQ data."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "pvlib>=0.11",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pv-outage = "pv_outage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
